experiment_id: E04_lora_random_5k_r8
seed: 42

model:
  model_id: Qwen/Qwen3-VL-4B-Instruct
  local_dir: models/Qwen3-VL-4B-Instruct
  revision: main
  trust_remote_code: true
  torch_dtype: bfloat16

data:
  train_file: data/processed/okvqa/train_random_5k_qwen.json
  image_root: .

training:
  output_dir: checkpoints/lora_random_5k
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  weight_decay: 0.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  logging_steps: 10
  save_strategy: epoch
  save_steps: 0
  save_total_limit: 2
  max_seq_length: 2048
  gradient_checkpointing: true
  max_pixels: 1048576
  report_to: none

lora:
  enabled: true
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

qlora:
  enabled: false
  load_in_4bit: false
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bfloat16
  bnb_4bit_use_double_quant: true

runtime:
  python_executable: python3
  trainer_command: "python3 scripts/train_lora.py"
  num_processes: 1

logging:
  write_environment_metadata: true
